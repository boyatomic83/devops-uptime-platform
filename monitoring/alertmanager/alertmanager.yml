# Routes alerts fired by Prometheus (monitoring/prometheus/alerts.yml).
#
# Default: everything goes to the uptime-monitor app, which forwards it to
# whichever channels you configured in .env (Telegram, WhatsApp, Slack/Discord).
# See README "Notifications". The token placeholder below is substituted at
# container start (see docker-compose.yml); never put real secrets in this file.
route:
  receiver: app
  group_by: [alertname, monitor]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: app
    webhook_configs:
      - url: http://app:3000/api/alerts/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __ALERTMANAGER_WEBHOOK_TOKEN__

inhibit_rules:
  # If the monitor app itself is down, don't also page for every target
  - source_matchers: [alertname="UptimeMonitorAppDown"]
    target_matchers: [alertname=~"TargetDown|TargetSlow"]
