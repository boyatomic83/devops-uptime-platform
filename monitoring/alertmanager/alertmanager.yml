# Routes alerts fired by Prometheus (monitoring/prometheus/alerts.yml).
# By default alerts are only visible in the Alertmanager UI (http://localhost:9093).
# To get notifications, uncomment a receiver below and point `route.receiver` at it.
route:
  receiver: "null"
  group_by: [alertname, monitor]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: "null"   # e.g. change to "discord" or "slack"

receivers:
  - name: "null"
  # - name: discord
  #   discord_configs:
  #     - webhook_url: https://discord.com/api/webhooks/XXX/YYY
  # - name: slack
  #   slack_configs:
  #     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
  #       channel: "#alerts"
  #       send_resolved: true

inhibit_rules:
  # If the monitor app itself is down, don't also page for every target
  - source_matchers: [alertname="UptimeMonitorAppDown"]
    target_matchers: [alertname=~"TargetDown|TargetSlow"]
