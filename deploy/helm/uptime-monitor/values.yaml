# >1 replica requires a database (postgresql.enabled or database.existingSecret).
# Replicas elect a leader via a Postgres advisory lock; only the leader runs checks.
replicaCount: 2

image:
  repository: ghcr.io/boyatomic83/uptime-monitor
  tag: latest
  pullPolicy: IfNotPresent

config:
  logLevel: info
  defaultIntervalSec: 30
  checkTimeoutMs: 5000
  monitors: "google=https://www.google.com,github=https://github.com"

# Name of an existing Secret holding notification settings (optional), any of:
#   ALERT_WEBHOOK_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   WHATSAPP_PHONE, WHATSAPP_CALLMEBOT_APIKEY, ALERTMANAGER_WEBHOOK_TOKEN
# e.g. kubectl -n uptime create secret generic uptime-notify --from-env-file=.env
alertWebhookSecret: ""

# External Postgres: name of an existing Secret with key DATABASE_URL.
# Takes precedence over the bundled postgresql below.
database:
  existingSecret: ""

# Bundled single-instance Postgres (good for demos/kind; use a managed DB in prod).
postgresql:
  enabled: true
  image: postgres:17-alpine
  database: uptime
  username: uptime
  # Leave empty to auto-generate (kept across upgrades via lookup).
  # With Argo CD (no lookup), set this or use database.existingSecret.
  password: ""
  storage: 1Gi
  storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: uptime.local
  tls: []

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 192Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

serviceMonitor:
  enabled: false   # requires prometheus-operator CRDs
  interval: 15s

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
