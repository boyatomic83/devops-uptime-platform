{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uptime.fullname" . }}
  labels: {{- include "uptime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "uptime.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
{{- end }}
