apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uptime.fullname" . }}
  labels: {{- include "uptime.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DEFAULT_INTERVAL_SEC: {{ .Values.config.defaultIntervalSec | quote }}
  CHECK_TIMEOUT_MS: {{ .Values.config.checkTimeoutMs | quote }}
  MONITORS: {{ .Values.config.monitors | quote }}
