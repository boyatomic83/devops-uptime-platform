name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uptime-monitor

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uptime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/uptime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: app/coverage }

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/uptime-monitor
      - name: Render chart in each supported mode
        run: |
          C=deploy/helm/uptime-monitor
          helm template t $C --set ingress.enabled=true --set serviceMonitor.enabled=true > /dev/null
          helm template t $C --set postgresql.enabled=false --set replicaCount=1 > /dev/null
          helm template t $C --set database.existingSecret=db --set autoscaling.enabled=true > /dev/null
          # guard: multiple replicas without a database must be rejected
          ! helm template t $C --set postgresql.enabled=false 2>/dev/null

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform/eks } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (Terraform, Helm, Dockerfile, k8s)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"   # report to the Security tab; don't block
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
      - name: Summary of HIGH/CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          skip-setup-trivy: true

  image:
    name: Build, scan & push image
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write   # keyless Cosign signing via GitHub OIDC
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: uptime-monitor:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-monitor:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-monitor:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (with SBOM + SLSA provenance attestations)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - name: Sign image (keyless, GitHub OIDC -> Sigstore)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Verify signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify "${IMAGE}@${{ steps.push.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com | jq '.[0].optional | {Issuer, Subject}'

  e2e:
    name: Deploy to kind & smoke test
    needs: [test, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - name: Build and load image into kind
        run: |
          docker build -t uptime-monitor:e2e app
          kind load docker-image uptime-monitor:e2e --name ci
      - name: Helm install (2 replicas + Postgres)
        run: |
          helm install uptime deploy/helm/uptime-monitor \
            --namespace uptime --create-namespace \
            --set image.repository=uptime-monitor --set image.tag=e2e --set image.pullPolicy=Never \
            --set config.monitors="self=http://127.0.0.1:3000/healthz" \
            --wait --timeout 300s
          kubectl -n uptime get pods -o wide
      - name: Smoke test
        run: |
          kubectl -n uptime port-forward svc/uptime-uptime-monitor 8080:80 &
          sleep 5
          curl -fsS localhost:8080/readyz | jq -e '.store == "postgres"'
          curl -fsS -X POST localhost:8080/api/monitors -H 'content-type: application/json' \
            -d '{"name":"service-dns","url":"http://uptime-uptime-monitor.uptime.svc/healthz","intervalSec":5}' | jq .
          curl -fsS localhost:8080/api/monitors | jq .
          curl -fsS localhost:8080/metrics | grep uptime_scheduler_leader
      - name: Exactly one leader, and failover works
        run: |
          leaders() {
            for p in $(kubectl -n uptime get pods -l app.kubernetes.io/name=uptime-monitor -o name); do
              kubectl -n uptime exec "$p" -- wget -qO- localhost:3000/api/whoami
              echo
            done | jq -s '[.[] | select(.leader)] | map(.pod)'
          }
          L=$(leaders); echo "leaders: $L"
          test "$(echo "$L" | jq length)" = 1
          OLD=$(echo "$L" | jq -r '.[0]')
          kubectl -n uptime delete pod "$OLD" --wait=false
          for i in $(seq 1 30); do
            L=$(leaders 2>/dev/null || echo '[]')
            if [ "$(echo "$L" | jq length)" = 1 ] && [ "$(echo "$L" | jq -r '.[0]')" != "$OLD" ]; then
              echo "new leader: $L"; exit 0
            fi
            sleep 2
          done
          echo "failover did not happen"; exit 1
      - name: Debug on failure
        if: failure()
        run: kubectl -n uptime get all && kubectl -n uptime describe pods && kubectl -n uptime logs -l app.kubernetes.io/name=uptime-monitor --tail=100; kubectl -n uptime logs statefulset/uptime-uptime-monitor-postgresql --tail=50

  policy:
    name: Kyverno admission policies (signed images only)
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: policy }
      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno -n kyverno --create-namespace --wait --timeout 300s
      - name: Apply policies
        run: |
          kubectl create namespace uptime
          kubectl apply -f deploy/policies/
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=120s
      - name: Signed, hardened image is admitted
        run: |
          helm install uptime deploy/helm/uptime-monitor -n uptime \
            --set image.tag=${GITHUB_SHA::7} --wait --timeout 300s
          kubectl -n uptime get pods -l app.kubernetes.io/name=uptime-monitor \
            -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.spec.containers[0].image}{"\n"}{end}'
      - name: Policy violations are rejected
        run: |
          # expect_reject <pattern-in-error> <kubectl args...>
          expect_reject() {
            pattern=$1; shift
            if out=$(kubectl -n uptime "$@" --dry-run=server 2>&1); then
              echo "::error::expected rejection: $*"; echo "$out"; exit 1
            fi
            echo "$out" | grep -qiE "$pattern" || { echo "::error::rejected for the wrong reason"; echo "$out"; exit 1; }
            echo "rejected as expected ($pattern)"
          }
          SEC='"securityContext":{"runAsNonRoot":true}'
          LIM='"resources":{"limits":{"cpu":"100m","memory":"64Mi"}}'
          # unsigned image from our registry (otherwise compliant pod)
          expect_reject 'verify-uptime-image-signature' run unsigned --image=ghcr.io/${{ github.repository_owner }}/uptime-monitor:unsigned \
            --overrides="{\"spec\":{$SEC,\"containers\":[{\"name\":\"unsigned\",\"image\":\"ghcr.io/${{ github.repository_owner }}/uptime-monitor:unsigned\",$LIM}]}}"
          # privileged container
          expect_reject 'disallow-privileged' run priv --image=busybox \
            --overrides="{\"spec\":{$SEC,\"containers\":[{\"name\":\"priv\",\"image\":\"busybox\",\"securityContext\":{\"privileged\":true},$LIM}]}}"
          # running as root allowed by default -> rejected
          expect_reject 'require-run-as-non-root' run root --image=busybox \
            --overrides="{\"spec\":{\"containers\":[{\"name\":\"root\",\"image\":\"busybox\",$LIM}]}}"
          # no resource limits
          expect_reject 'require-resource-limits' run nolimits --image=busybox \
            --overrides="{\"spec\":{$SEC,\"containers\":[{\"name\":\"nolimits\",\"image\":\"busybox\"}]}}"
      - name: Debug on failure
        if: failure()
        run: kubectl get clusterpolicy -o wide; kubectl -n uptime get events --sort-by=.lastTimestamp | tail -30; kubectl get policyreport -A
